[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["app.py"]

[tool.ruff.lint]
select = ["E", "F", "B", "W"]
ignore = ["B008", "E501", "B905"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["requests", "requests.*", "ibm_watsonx_ai.*", "docling.*", "pypdf.*"]
ignore_missing_imports = true
